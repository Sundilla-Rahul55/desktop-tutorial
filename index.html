<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Tutorial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            text-align: center;
        }

        h1 {
            color: #58a6ff;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Hello World! 🚀</h1>
        <p>My HTML project is running inside Antigravity IDE!</p>
    </div>
</body>

</html>
